server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript text/plain;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    server_tokens off;

    # nginx не наследует add_header в location, где объявлен свой, поэтому
    # набор заголовков повторяется в каждом блоке целиком.
    # Внешних запросов у сайта нет — политика это фиксирует.
    set $csp "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location / {
        try_files $uri $uri/ $uri.html =404;
        # Страницы без кеша: сайт пересобирается целиком, и читатель не должен
        # получить старую главу после обновления.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 404 /index.html;
}
